packages:
  - "apps/*"
  - "packages/*"

# allowBuilds: pnpm 11 syntax (used locally and on Vercel when ENABLE_EXPERIMENTAL_COREPACK=1 is set)
# onlyBuiltDependencies: pnpm 9/10 syntax (fallback for older pnpm)
# Both are present so the file works regardless of pnpm version.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - unrs-resolver
