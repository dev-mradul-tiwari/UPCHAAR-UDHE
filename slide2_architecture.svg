<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C" />
    </marker>
    <filter id="shd" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container Box 1: User Access Layer -->
  <rect x="40" y="40" width="400" height="150" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shd)"/>
  <rect x="55" y="55" width="370" height="30" rx="6" fill="#0284C7"/>
  <text x="240" y="75" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">User Access Layer</text>
  <text x="75" y="110" font-size="12" font-weight="600" fill="#0369A1">• Patient Web &amp; Mobile App (Next.js 15)</text>
  <text x="75" y="135" font-size="12" font-weight="600" fill="#0369A1">• Doctor Desk Console ('Call Next' OPD Desk)</text>
  <text x="75" y="160" font-size="12" font-weight="600" fill="#0369A1">• Hospital Admin Dashboard (Beds &amp; Inventory)</text>

  <!-- Arrow 1 Down -->
  <path d="M 240 190 L 240 230" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Container Box 2: Security & API Gateway -->
  <rect x="40" y="245" width="400" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2" filter="url(#shd)"/>
  <rect x="55" y="260" width="370" height="30" rx="6" fill="#059669"/>
  <text x="240" y="280" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Security &amp; API Gateway</text>
  <text x="75" y="315" font-size="12" font-weight="600" fill="#047857">• Role-Based JWT Authentication</text>
  <text x="75" y="340" font-size="12" font-weight="600" fill="#047857">• Per-Request Zod Schema Validation</text>
  <text x="75" y="365" font-size="12" font-weight="600" fill="#047857">• Centralized Express REST API Server</text>

  <!-- Arrow 2 Down -->
  <path d="M 240 395 L 240 435" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- Container Box 3: Core Data & Realtime Engine -->
  <rect x="40" y="450" width="400" height="150" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shd)"/>
  <rect x="55" y="465" width="370" height="30" rx="6" fill="#7C3AED"/>
  <text x="240" y="485" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Core Data &amp; Realtime Engine</text>
  <text x="75" y="520" font-size="12" font-weight="600" fill="#6D28D9">• PostgreSQL 16 Database (Prisma ORM)</text>
  <text x="75" y="545" font-size="12" font-weight="600" fill="#6D28D9">• SSE Engine (Server-Sent Events Live Stream)</text>
  <text x="75" y="570" font-size="12" font-weight="600" fill="#6D28D9">• Live OPD Queue &amp; Token Counter</text>

  <!-- Right Horizontal Connectors -->
  <path d="M 440 115 L 490 115 L 490 320 L 515 320" fill="none" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 440 320 L 515 320" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 440 525 L 490 525 L 490 320 L 515 320" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- Container Box 4: Integrated Platform Services (Right Side) -->
  <rect x="525" y="40" width="335" height="560" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" filter="url(#shd)"/>
  <rect x="540" y="55" width="305" height="36" rx="6" fill="#EA580C"/>
  <text x="692" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Integrated Platform Services</text>

  <!-- Service 1 -->
  <rect x="545" y="115" width="295" height="95" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="565" y="145" font-size="13" font-weight="700" fill="#C2410C">🤖 Google Gemini AI API</text>
  <text x="565" y="170" font-size="11" font-weight="600" fill="#EA580C">• Dr. Positive pre/post-op counselor</text>
  <text x="565" y="190" font-size="11" font-weight="600" fill="#EA580C">• Streamed conversational replies</text>

  <!-- Service 2 -->
  <rect x="545" y="230" width="295" height="95" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="565" y="260" font-size="13" font-weight="700" fill="#C2410C">💊 AI Drug Interaction Checker</text>
  <text x="565" y="285" font-size="11" font-weight="600" fill="#EA580C">• 2+ medicine conflict assessment</text>
  <text x="565" y="305" font-size="11" font-weight="600" fill="#EA580C">• Polypharmacy risk report</text>

  <!-- Service 3 -->
  <rect x="545" y="345" width="295" height="95" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="565" y="375" font-size="13" font-weight="700" fill="#C2410C">🆔 ABHA Digital Health Stack</text>
  <text x="565" y="400" font-size="11" font-weight="600" fill="#EA580C">• Ayushman Bharat health ID sync</text>
  <text x="565" y="420" font-size="11" font-weight="600" fill="#EA580C">• Interoperable patient history</text>

  <!-- Service 4 -->
  <rect x="545" y="460" width="295" height="115" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="565" y="490" font-size="13" font-weight="700" fill="#C2410C">🏥 Bed &amp; Pharmacy Inventory</text>
  <text x="565" y="515" font-size="11" font-weight="600" fill="#EA580C">• Live ICU / General bed counts</text>
  <text x="565" y="535" font-size="11" font-weight="600" fill="#EA580C">• Low-stock medicine alerts</text>
  <text x="565" y="555" font-size="11" font-weight="600" fill="#EA580C">• Expiry threshold warnings</text>

</svg>
